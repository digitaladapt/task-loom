# TaskLoom root compose — run the whole application from this working tree.
#
# ONE container (SPEC §6): the web server, the MCP endpoint (POST /mcp), and
# the run engine's worker fleet all run in the `taskloom` service, started and
# supervised by docker/entrypoint.sh (`serve`). TASKLOOM_LLM_MAX_CONCURRENCY
# is the number of llm workers the entrypoint starts — it is the concurrency
# semaphore, not a scale-out instruction.
#
# Schema changes stay an explicit deployment step (§8.6), but `docker compose
# up` still does everything: the one-shot `migrate` service runs first, and
# the app starts only after it succeeds (service_completed_successfully).
#
# Usage:
#   cp .env.example .env        # set APP_SECRET + TASKLOOM_ADMIN_PASSWORD
#   docker compose up -d        # migrate → app (web + workers)
#   → admin UI: http://localhost:8080
#
# This file builds the image from source and runs APP_ENV=prod: the image is
# installed with --no-dev, UI development is `symfony serve` (hot reload),
# not this compose file.

x-taskloom-env: &taskloom-env
  APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
  TASKLOOM_ADMIN_PASSWORD: ${TASKLOOM_ADMIN_PASSWORD:?set TASKLOOM_ADMIN_PASSWORD in .env}
  TASKLOOM_MCP_API_KEY: ${TASKLOOM_MCP_API_KEY:?set TASKLOOM_MCP_API_KEY in .env}
  # LLM endpoint (OpenAI-compatible). Local-first: typically Ollama.
  TASKLOOM_LLM_BASE_URL: ${TASKLOOM_LLM_BASE_URL:-http://host.docker.internal:11434}
  TASKLOOM_LLM_MODEL: ${TASKLOOM_LLM_MODEL:-qwen3:14b}
  TASKLOOM_LLM_API_KEY: ${TASKLOOM_LLM_API_KEY:-}
  TASKLOOM_LLM_TIMEOUT: ${TASKLOOM_LLM_TIMEOUT:-300}
  # Debug: dump the raw LLM response body to the log (off by default).
  TASKLOOM_DEBUG_RAW_LLM: ${TASKLOOM_DEBUG_RAW_LLM:-0}
  # Concurrency: llm workers to run (each holds one request on the wire).
  TASKLOOM_LLM_MAX_CONCURRENCY: ${TASKLOOM_LLM_MAX_CONCURRENCY:-1}
  # ── Shutdown ──────────────────────────────────────────────────────────
  # How long the entrypoint waits for the workers to finish their current
  # message before it SIGKILLs them. A worker finishes a message, not a run.
  #
  # These three were documented in .env.example but NOT forwarded here, which
  # made them silently inert: the image runs with dotenv disabled, so an
  # unforwarded variable cannot be set by the operator at all. Setting
  # TASKLOOM_SHUTDOWN_TIMEOUT=120 in .env changed nothing, and a stop always
  # used the entrypoint's 30s fallback — long enough to hit a `docker stop`
  # grace period that was itself the default, and leave claims behind.
  # (DeploymentContractTest now pins this: every variable the entrypoint reads
  # must be forwarded.)
  TASKLOOM_SHUTDOWN_TIMEOUT: ${TASKLOOM_SHUTDOWN_TIMEOUT:-30}
  TASKLOOM_WORKER_TIME_LIMIT: ${TASKLOOM_WORKER_TIME_LIMIT:-3600}
  TASKLOOM_WORKER_MEMORY_LIMIT: ${TASKLOOM_WORKER_MEMORY_LIMIT:-256M}
  # Take a leftover claim of any age at boot. Correct for this file's single-
  # container shape; raise it (to TASKLOOM_LLM_TIMEOUT + 60) only if you add a
  # second fleet against the same database — see App\RunEngine\ClaimReaper.
  TASKLOOM_FLEET_GRAB_AFTER: ${TASKLOOM_FLEET_GRAB_AFTER:-0}
  # Run migrations at container boot. Leave 0: the `migrate` service above owns
  # schema changes (§8.6), and a container that migrates at boot cannot be
  # scaled past one replica.
  TASKLOOM_MIGRATE_ON_BOOT: ${TASKLOOM_MIGRATE_ON_BOOT:-0}
  # Tool turns mostly wait on external servers: a few personas at once is safe.
  TASKLOOM_TOOL_MAX_CONCURRENCY: ${TASKLOOM_TOOL_MAX_CONCURRENCY:-2}
  # Wall-clock timezone schedules are evaluated in (SPEC §14). Required.
  TASKLOOM_TIMEZONE: ${TASKLOOM_TIMEZONE:-UTC}
  # Units the grounding block announces to the model: metric or imperial.
  TASKLOOM_UNITS: ${TASKLOOM_UNITS:-metric}
  # Where the operator is (free text, one line) — omitted from the block
  # when empty. Forwarded so the knob is actually settable: the image runs
  # with dotenv disabled, so an unforwarded variable is silently inert.
  TASKLOOM_LOCATION: ${TASKLOOM_LOCATION:-}
  # The run prompt's configurable parts (SPEC §4.1). Empty by default: the
  # built-in text is used. Set the *_FILE forms for multi-line prose (a path
  # INSIDE the container — mount it), never both forms of one knob.
  TASKLOOM_SYSTEM_PROMPT: ${TASKLOOM_SYSTEM_PROMPT:-}
  TASKLOOM_SYSTEM_PROMPT_FILE: ${TASKLOOM_SYSTEM_PROMPT_FILE:-}
  TASKLOOM_COMPLETION_PROMPT: ${TASKLOOM_COMPLETION_PROMPT:-}
  TASKLOOM_COMPLETION_PROMPT_FILE: ${TASKLOOM_COMPLETION_PROMPT_FILE:-}
  # Render the prompt's human-readable toolbox list (the tool definitions are
  # always sent regardless). Set to 0 to save tokens on large toolboxes.
  TASKLOOM_PROMPT_TOOLBOX_LIST: ${TASKLOOM_PROMPT_TOOLBOX_LIST:-1}
  # The scheduler daemon: enabled; tick interval in seconds.
  TASKLOOM_SCHEDULER_ENABLED: ${TASKLOOM_SCHEDULER_ENABLED:-1}
  TASKLOOM_SCHEDULE_INTERVAL: ${TASKLOOM_SCHEDULE_INTERVAL:-60}
  # Run-engine budgets (fail-closed).
  TASKLOOM_STEP_BUDGET: ${TASKLOOM_STEP_BUDGET:-50}
  TASKLOOM_TOOL_RETRIES: ${TASKLOOM_TOOL_RETRIES:-2}
  TASKLOOM_CIRCUIT_BREAKER: ${TASKLOOM_CIRCUIT_BREAKER:-3}
  TASKLOOM_CONTEXT_LIMIT: ${TASKLOOM_CONTEXT_LIMIT:-32768}
  TASKLOOM_MAX_TOOL_OUTPUT_PCT: ${TASKLOOM_MAX_TOOL_OUTPUT_PCT:-15}
  TASKLOOM_WINDOW_TAIL_EXCHANGES: ${TASKLOOM_WINDOW_TAIL_EXCHANGES:-10}
  # Absolute URLs in non-HTTP contexts: must match the public-facing address.
  DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
  # SQLite (WAL) on the data volume; the lanes share this file.
  DATABASE_URL: ${DATABASE_URL:-sqlite:///%kernel.project_dir%/data/taskloom.db}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}

services:
  # One-shot schema deployment (§8.6): runs to completion, then exits. The app
  # waits for it (service_completed_successfully), so `docker compose up` is
  # still a single command for the operator.
  migrate:
    build: .
    image: taskloom:dev
    command: ['php', 'bin/console', 'doctrine:migrations:migrate', '--no-interaction', '--allow-no-migration']
    restart: "no"
    environment:
      <<: *taskloom-env
      # The migrate container must not fight the app's boot sync for the DB.
      TASKLOOM_SYNC_ON_BOOT: '0'
    volumes:
      - taskloom-data:/app/data

  taskloom:
    build: .
    image: taskloom:dev
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *taskloom-env
    volumes:
      - taskloom-data:/app/data
    ports:
      - "8080:80"
    # Must exceed TASKLOOM_SHUTDOWN_TIMEOUT, or Docker will SIGKILL the fleet
    # before the entrypoint has finished stopping the workers gracefully. This
    # is the outer bound and the entrypoint's window is the inner one; if you
    # raise TASKLOOM_SHUTDOWN_TIMEOUT past this, a stop that is still winding
    # down gets SIGKILLed from the outside, which is how a claim ends up
    # orphaned with no chance to release it. Keep this the larger of the two.
    stop_grace_period: 90s

volumes:
  taskloom-data:
