security:
    password_hashers:
        App\Security\AdminUser: { algorithm: auto }

    providers:
        admin_provider:
            id: App\Security\AdminUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|js|build|assets)/
            security: false

        public:
            pattern: ^/(health|ready)$
            security: false

        main:
            lazy: true
            provider: admin_provider
            custom_authenticators:
                - App\Security\AdminAuthenticator
            entry_point: App\Security\AdminAuthenticator
            # HTTP Basic: stateless, credentials on every request — no
            # session fixation or logout surface to manage.

    access_control:
        - { path: ^/(_profiler|_wdt|health|ready|assets|build|css|js), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADMIN }