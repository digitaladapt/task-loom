# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    #
    # The app's OWN defaults for the tuning knobs.
    #
    # These used to exist only in compose.yaml (`${TASKLOOM_STEP_BUDGET:-50}`),
    # so "forgetting to set it" worked inside Docker and broke everywhere else —
    # every real page 500s with `Environment variable not found:
    # "TASKLOOM_MAX_INPUT_ARTIFACT_PCT"`, while /health stays green, because
    # services are built lazily and the health route never touches the context
    # window. That asymmetry is what made it look fine from the outside.
    #
    # A deployment default belongs to the deployment, not to one way of
    # deploying, so the values now live here and compose.yaml's `:-` fallbacks
    # agree with them. Each is `%env(default:PARAM:...)%` below, so an explicit
    # environment variable still wins — this changes nothing for a Docker
    # deployment, which was already getting these numbers.
    #
    # The values are deliberately the same as .env.example's, so the three
    # places a knitter might read (here, compose, the example env file) cannot
    # state three different numbers.
    #
    # NOT defaulted here, on purpose:
    #   TASKLOOM_TIMEZONE        — a wrong timezone is a silent bug (an 08:00
    #                              schedule running at 08:00 UTC); its absence
    #                              is a loud one. Compose defaults it to UTC.
    #   TASKLOOM_ADMIN_PASSWORD  — no default is the security feature.
    #   TASKLOOM_MCP_API_KEY     — same.
    #   TASKLOOM_LLM_BASE_URL    — compose's fallback is a Docker-only hostname
    #                              (host.docker.internal), so any value chosen
    #                              here would be wrong off-Docker and confusing
    #                              on it.
    TASKLOOM_CONTEXT_LIMIT: 32768
    TASKLOOM_MAX_TOOL_OUTPUT_PCT: 15
    TASKLOOM_MAX_INPUT_ARTIFACT_PCT: 50
    TASKLOOM_WINDOW_TAIL_EXCHANGES: 10
    # Session memory (docs/design/SESSION_TASKS.md §3.3): the store's four
    # caps. The block's own percentage is separate from the Inputs cap on
    # purpose — memory and inputs are different kinds of never-pruned
    # content, and one knob should not tune the other.
    TASKLOOM_SESSION_HOT: 5
    TASKLOOM_SESSION_COLD: 25
    TASKLOOM_SESSION_WRITE_MAX_CHARS: 2000
    TASKLOOM_SESSION_MAX_MEMORY_PCT: 10
    TASKLOOM_STEP_BUDGET: 50
    TASKLOOM_TOOL_RETRIES: 2
    TASKLOOM_CIRCUIT_BREAKER: 3
    TASKLOOM_LLM_MODEL: 'qwen3:14b'
    TASKLOOM_LLM_TIMEOUT: 300

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Toolbox\OpenApiServerReader:
        arguments:
            $httpClient: '@http_client'

    # The MCP server role needs the full Symfony container so tool handler
    # classes resolve from real DI (repositories, entity manager, logging).
    App\Mcp\Server\TaskServerFactory:
        public: true
        arguments:
            $container: '@service_container'
            # Pool name as Symfony registers it, NOT 'cache.mcp_sessions'.
            $sessionPool: '@mcp_sessions'

    # The MCP endpoint (SPEC §11) resolves PSR-7/PSR-17 parts for its
    # Symfony→PSR-7 bridge. Stateless, so shared is fine.
    app.psr17_http_factory:
        class: GuzzleHttp\Psr7\HttpFactory
        public: true

    App\Controller\McpController:
        arguments:
            $httpFactory: '@app.psr17_http_factory'

    # Referenced by name from the MCP tool handler resolution (and the
    # gating tests, which must exercise the real persisted gate).
    App\Mcp\Server\TaskCrud:
        public: true

    App\Mcp\Server\TaskTools:
        public: true

    # Same reason as TaskTools: the MCP server role resolves tool handler
    # classes through PSR-11 at call time (SPEC §10, §11).
    App\Mcp\Server\RunReviewTools:
        public: true

    # Protocol → reader map for the catalog synchronizer (SPEC §7).
    App\Toolbox\ServerReaderRegistry:
        arguments:
            $readers:
                mcp: '@App\Toolbox\McpServerReader'
                openapi: '@App\Toolbox\OpenApiServerReader'

    # The execution-claim protocol (SPEC §6, §15), written once and used by
    # every claimable aggregate: runs and chat exchanges. Constructed from the
    # DBAL connection rather than the entity manager, because the claim is raw
    # SQL by design — entity flushes must not be able to touch these columns.
    App\Claims\ClaimStore:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    # Boot recovery (SPEC §6.2): clears execution claims a fleet that was
    # killed rather than stopped left behind. Only ever invoked behind the
    # fleet-owner gate in app:run:requeue --startup — see
    # App\RunEngine\FleetOwnership for why the authority is granted rather
    # than assumed.
    # No arguments of its own: the reaper sweeps through the shared
    # ClaimStore, so adding a claimable aggregate cannot leave it reaping one
    # table less than the system has.
    App\RunEngine\ClaimReaper: ~

    # The chat turn loop (SPEC §15).
    #
    # `$bus` is passed explicitly and is nullable, exactly as the run engine's
    # is: the enqueue has to happen inside the committing transaction, so it is
    # a constructor dependency rather than a call the caller makes afterwards.
    #
    # `$executor`, `$prompts` and `$toolboxSnapshotTools` are named for a
    # sharper reason: this constructor has optional parameters *after* required
    # ones, and naming only `$bus` lets the container wire the remaining
    # arguments positionally — which quietly handed the message bus to the tool
    # executor and only failed at request time. Naming them makes the wiring
    # explicit and the failure impossible.
    App\Chat\ChatEngine:
        arguments:
            $executor: '@App\RunEngine\ToolExecutor'
            $prompts: '@App\RunEngine\PromptCompiler'
            $bus: '@messenger.default_bus'

    # Run engine (SPEC §3, §5): loop, prompt compiler, budgets.
    App\Llm\LlmClient:
        arguments:
            $baseUrl: '%env(TASKLOOM_LLM_BASE_URL)%'
            $model: '%env(default:TASKLOOM_LLM_MODEL:TASKLOOM_LLM_MODEL)%'
            $apiKey: '%env(TASKLOOM_LLM_API_KEY)%'
            $timeoutSeconds: '%env(int:default:TASKLOOM_LLM_TIMEOUT:TASKLOOM_LLM_TIMEOUT)%'
            # Off unless explicitly enabled — see the class. Wrapped in
            # `default::` so an unset variable resolves to null (off)
            # instead of failing the boot.
            $debugRawResponse: '%env(default::TASKLOOM_DEBUG_RAW_LLM)%'

    # Admin auth (SPEC §4.3): one env-provided password for the UI's session
    # login, one env-provided key for the MCP bearer endpoint, one admin
    # principal. Both credentials are compared constant-time and both fail
    # closed when unset — see App\Security\AdminPassword and
    # App\Security\McpApiKey for why they are deliberately separate secrets.
    App\Security\AdminPassword:
        arguments:
            $password: '%env(TASKLOOM_ADMIN_PASSWORD)%'

    App\Security\McpApiKey:
        arguments:
            $apiKey: '%env(TASKLOOM_MCP_API_KEY)%'

    # The scheduler (SPEC §14). TASKLOOM_TIMEZONE is required, not
    # defaulted: a schedule means "this wall-clock time where the operator
    # lives", and silently evaluating 08:00 in UTC is the quiet-wrongness
    # this project refuses. The container's boot lint names it when missing.
    App\Scheduler\TaskScheduler:
        arguments:
            $timezone: '%env(TASKLOOM_TIMEZONE)%'

    # Plain-English schedule narration and the upcoming-occurrence list for
    # the admin editor (SPEC §8, §14). Same required deployment timezone as
    # the scheduler: a schedule is only meaningful together with the clock it
    # is interpreted in.
    App\Scheduler\ScheduleNarrator:
        arguments:
            $timezone: '%env(TASKLOOM_TIMEZONE)%'

    App\Context\ContextWindow:
        arguments:
            $contextLimitTokens: '%env(int:default:TASKLOOM_CONTEXT_LIMIT:TASKLOOM_CONTEXT_LIMIT)%'
            $maxToolOutputPct: '%env(float:default:TASKLOOM_MAX_TOOL_OUTPUT_PCT:TASKLOOM_MAX_TOOL_OUTPUT_PCT)%'
            $windowTailExchanges: '%env(int:default:TASKLOOM_WINDOW_TAIL_EXCHANGES:TASKLOOM_WINDOW_TAIL_EXCHANGES)%'
            $maxInputArtifactPct: '%env(float:default:TASKLOOM_MAX_INPUT_ARTIFACT_PCT:TASKLOOM_MAX_INPUT_ARTIFACT_PCT)%'
            # The rendered `## Memories` block's own percentage
            # (docs/design/SESSION_TASKS.md §3.3) — the backstop behind the
            # store's count caps.
            $maxSessionMemoryPct: '%env(float:default:TASKLOOM_SESSION_MAX_MEMORY_PCT:TASKLOOM_SESSION_MAX_MEMORY_PCT)%'

    # The session memory store (docs/design/SESSION_TASKS.md §3, build order
    # step 2): the single writer of a session's memory, and the keeper of its
    # caps. The write-size cap lives here rather than in the tools because it
    # bounds ONE write — the count caps cannot, and a single unbounded write
    # is as bad for the singleton objective as for a note (§3.3).
    App\Session\SessionMemoryStore:
        arguments:
            $hotCap: '%env(int:default:TASKLOOM_SESSION_HOT:TASKLOOM_SESSION_HOT)%'
            $coldCap: '%env(int:default:TASKLOOM_SESSION_COLD:TASKLOOM_SESSION_COLD)%'
            $writeMaxChars: '%env(int:default:TASKLOOM_SESSION_WRITE_MAX_CHARS:TASKLOOM_SESSION_WRITE_MAX_CHARS)%'

    # The grounding block (SPEC §4.2 / §5.6). Same required deployment
    # timezone as the scheduler: the block states the wall-clock time the
    # runs and the schedules share, so a Chicago deployment reads
    # "09:15 (America/Chicago)" rather than the container clock's UTC.
    #
    # Units and location are defaulted rather than required: unset units mean
    # metric, which is what this knob has always been, and unset location
    # simply omits the line — no existing deployment changes behavior on
    # upgrade, and only an explicit value moves it. A bad value still fails
    # closed (Units::fromConfig, Grounding::resolveLocation), naming the
    # variable.
    App\Context\Grounding:
        arguments:
            $timezone: '%env(TASKLOOM_TIMEZONE)%'
            $location: '%env(default::TASKLOOM_LOCATION)%'
            $units: '%env(default::TASKLOOM_UNITS)%'

    # The configurable parts of the run prompt (SPEC §4.1). Every text knob
    # is optional: 'default::' resolves a missing (or empty) variable to
    # null, and PromptTemplate falls back to the built-in text. The FILE
    # forms exist because multi-line prose in an env var is a quoting
    # minefield; set one form of a knob, not both (PromptTemplate refuses
    # both — two sources for one value is ambiguous).
    App\RunEngine\PromptTemplate:
        arguments:
            $preamble: '%env(default::TASKLOOM_SYSTEM_PROMPT)%'
            $preambleFile: '%env(default::TASKLOOM_SYSTEM_PROMPT_FILE)%'
            $completion: '%env(default::TASKLOOM_COMPLETION_PROMPT)%'
            $completionFile: '%env(default::TASKLOOM_COMPLETION_PROMPT_FILE)%'
            $listTools: '%env(default::TASKLOOM_PROMPT_TOOLBOX_LIST)%'
            $includeBriefInSystem: '%env(default::TASKLOOM_PROMPT_BRIEF_IN_SYSTEM)%'

    App\RunEngine\RunEngine:
        arguments:
            $budgets:
                step_budget: '%env(int:default:TASKLOOM_STEP_BUDGET:TASKLOOM_STEP_BUDGET)%'
                tool_retries: '%env(int:default:TASKLOOM_TOOL_RETRIES:TASKLOOM_TOOL_RETRIES)%'
                circuit_breaker: '%env(int:default:TASKLOOM_CIRCUIT_BREAKER:TASKLOOM_CIRCUIT_BREAKER)%'
            # The `## Memories` seam (docs/design/SESSION_TASKS.md §4.1,
            # build order step 2). Named explicitly so the wiring is visible
            # here rather than inferred: this is the first mutable,
            # per-request section a run request has ever had, and it should
            # be a deliberate line in the config, not a side effect of a
            # type-hint.
            $sessionMemory: '@App\Session\SessionMemoryRenderer'

    # The step model's run graph (SPEC §13.3): same budgets as the engine —
    # a child run's constitution is frozen with the same knobs a standalone
    # run uses.
    App\RunEngine\RunGraph:
        arguments:
            $budgets:
                step_budget: '%env(int:default:TASKLOOM_STEP_BUDGET:TASKLOOM_STEP_BUDGET)%'
                tool_retries: '%env(int:default:TASKLOOM_TOOL_RETRIES:TASKLOOM_TOOL_RETRIES)%'
                circuit_breaker: '%env(int:default:TASKLOOM_CIRCUIT_BREAKER:TASKLOOM_CIRCUIT_BREAKER)%'
