; TaskLoom php.ini overrides — merged after the FrankenPHP base image defaults.
; Anything app-specific belongs here, not in the base image.

memory_limit = 512M
; LLM payloads and tool results can be large; JSON ops on them are common.
opcache.enable_cli = 1
; The run engine's CLI worker (Messenger) benefits from OPcache too.

; SQLite + WAL — long-lived prepared statements are the norm.
; See docs/design/SPEC.md §11 (SQLite single file, WAL).
pdo_sqlite.defensive = 1

upload_max_filesize = 8M
post_max_size = 8M