# TaskLoom compose example — one app, one volume.
#
# TaskLoom is a single Symfony app: admin UI + run engine + MCP task-tools
# server in one container; the scheduler tick worker (v1.1) runs from the same
# image. SQLite (WAL) lives on the taskloom-data volume.
#
# Usage:
#   cp docs/examples/.env.example .env      # compose reads .env from this directory
#   edit .env                              # set APP_SECRET + TASKLOOM_ADMIN_PASSWORD
#   docker compose -f docs/examples/compose.yaml up -d
#   → admin UI: http://localhost:8080
#
# The compose file is environment-agnostic: every value comes from the
# environment (a .env file next to it, or real env vars in prod). Core
# secrets use the ":?" form — compose REFUSES to start if they are missing.

services:
  taskloom:
    build: ../..
    image: taskloom:latest
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      TASKLOOM_ADMIN_PASSWORD: ${TASKLOOM_ADMIN_PASSWORD:?set TASKLOOM_ADMIN_PASSWORD in .env}
      # LLM endpoint (OpenAI-compatible). Local-first: typically Ollama.
      TASKLOOM_LLM_BASE_URL: ${TASKLOOM_LLM_BASE_URL:-http://host.docker.internal:11434}
      TASKLOOM_LLM_MODEL: ${TASKLOOM_LLM_MODEL:-qwen3:14b}
      # Concurrency: how many LLM requests may be in flight at once.
      TASKLOOM_LLM_MAX_CONCURRENCY: ${TASKLOOM_LLM_MAX_CONCURRENCY:-1}
      # SQLite database (WAL) on the data volume.
      DATABASE_URL: ${DATABASE_URL:-sqlite:///%kernel.project_dir%/data/taskloom.db}
    volumes:
      - taskloom-data:/app/data
    ports:
      - "8080:80"

volumes:
  taskloom-data: